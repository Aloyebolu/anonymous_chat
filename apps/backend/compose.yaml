services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: anonymous_chat
      POSTGRES_USER: anonymous_chat
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anonymous_chat -d anonymous_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
